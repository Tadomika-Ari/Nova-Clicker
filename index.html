<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nova Clicker</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="stars"></div>
    <h1>Score : <span id="score">0</span></h1>
    <img id="marvin" src="ressource/marvin.png" alt="marvin">

    <button class="panel-toggle" id="panelToggle">❮</button>

    <div class="side-panel" id="sidePanel">
        <div class="panel-title">Reset</div>
        <button class="trigger" id="reset" onclick="resetScore()">Reset</button>
        <div class="panel-title">Upgrades</div>
        <button class="upgrade-button" onclick="addTomatoFarm()">
            <div class="info">
                <span class="name"><span id="tomatofarmdisplay"></span> Tomato farm :</span>
                <span class="cost"><span id="tomatofarmcostdisplay"></span> points</span>
            </div>
        </button>
        <button class="upgrade-button" onclick="addPassive()">
            <div class="info">
                <span class="name">Moon rock farm :</span>
                <span class="cost">10k points</span>
            </div>
        </button>
    </div>

    <script src="scripts/script.js"></script>
</body>
</html>
